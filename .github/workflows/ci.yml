name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      RECORDER_DOCS_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-2025
          - platform: Linux
            os: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up locked Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Set up locked pnpm and store cache
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
          run_install: false
          cache: true
          cache_dependency_path: pnpm-lock.yaml
      - name: Report runner and toolchain
        run: |
          node -e "console.log(JSON.stringify({ node: process.version, platform: process.platform, arch: process.arch, image: process.env.ImageOS, imageVersion: process.env.ImageVersion, runnerVersion: process.env.ACTIONS_RUNNER_VERSION, sha: process.env.GITHUB_SHA }, null, 2))"
          pnpm --version
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Test title checks
        run: node --test scripts/check-pr-title.test.mjs
      - name: Test related documentation checks
        run: node --test scripts/check-docs.test.mjs
      - name: Build, typecheck, test, and check docs
        run: pnpm check

  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up locked Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Check PR title from event JSON
        run: node scripts/check-pr-title.mjs
